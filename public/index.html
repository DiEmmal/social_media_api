<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to My API</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --card: #ffffff;
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        color: var(--text);
      }

      .container {
        width: min(760px, 90vw);
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 36px 28px;
      }

      .eyebrow {
        margin: 0 0 12px;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--primary);
        font-weight: 700;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .routes {
        margin-top: 24px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
        color: var(--text);
      }

      ul {
        margin: 0;
        padding-left: 20px;
      }

      li {
        margin-bottom: 10px;
        color: var(--text);
      }

      code {
        background: #eef2ff;
        border: 1px solid #dfe3ff;
        color: var(--primary-dark);
        border-radius: 8px;
        padding: 4px 8px;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <p class="eyebrow">API status</p>
        <h1>Welcome to my API</h1>
        <p>
          This is a simple fallback page for routes that are not yet configured.
          The server is running correctly, and you can use the endpoints below.
        </p>

        <div class="routes">
          <h2>Available routes</h2>
          <ul>
            <li><code>POST /api/auth/login</code></li>
            <li><code>POST /api/auth/register</code></li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
